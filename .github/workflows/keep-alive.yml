name: Render Keep-Alive Heartbeat

on:
  schedule:
    # Run 4 times per hour at explicit off-peak minutes (:07, :22, :37, :52) to prevent global queue drops
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: # Allows manual triggering from GitHub Actions UI

concurrency:
  group: keep-alive-ping
  cancel-in-progress: true

jobs:
  ping:
    name: Ping Render Web Service
    runs-on: ubuntu-latest

    steps:
      - name: Send HTTP Heartbeat to Render Backend
        run: |
          echo "Sending keep-alive ping to Render backend..."
          response=$(curl -s -o /dev/null -w "%{http_code}" https://job-tracker-api-72bt.onrender.com/)
          echo "Render HTTP Response Code: $response"
          if [ "$response" -ne 200 ]; then
            echo "Warning: Render responded with status $response"
          fi
