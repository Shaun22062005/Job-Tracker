name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Run Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r job-tracker-api/requirements.txt

      - name: Run Pytest Suite
        env:
          SECRET_KEY: ci-secret-key-testing-12345
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 60
        run: |
          cd job-tracker-api
          pytest -v

  frontend-tests:
    name: Run Angular Vitest Suite & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: job-tracker/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd job-tracker
          npm ci

      - name: Run Unit Tests (Vitest)
        run: |
          cd job-tracker
          npm test -- --watch=false

      - name: Build Production Frontend
        run: |
          cd job-tracker
          npm run build
